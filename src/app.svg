<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="256"
     height="256"
     viewBox="0 0 256 256">

    <defs>
        <linearGradient id="bg"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%" stop-color="#667eea"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>

        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">
            <feDropShadow dx="0"
                          dy="8"
                          stdDeviation="10"
                          flood-opacity="0.22"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect x="12"
          y="12"
          width="232"
          height="232"
          rx="52"
          fill="url(#bg)"/>

    <!-- Calendar -->
    <rect x="55"
          y="58"
          width="146"
          height="145"
          rx="20"
          fill="#ffffff"
          filter="url(#shadow)"/>

    <!-- Calendar top -->
    <rect x="55"
          y="58"
          width="146"
          height="42"
          rx="20"
          fill="#f3f4f6"/>

    <rect x="55"
          y="80"
          width="146"
          height="20"
          fill="#f3f4f6"/>

    <!-- Rings -->
    <rect x="83"
          y="43"
          width="15"
          height="38"
          rx="7"
          fill="#ffffff"/>

    <rect x="158"
          y="43"
          width="15"
          height="38"
          rx="7"
          fill="#ffffff"/>

    <!-- Task lines -->
    <rect x="79"
          y="119"
          width="15"
          height="15"
          rx="4"
          fill="#667eea"/>

    <rect x="104"
          y="120"
          width="68"
          height="10"
          rx="5"
          fill="#d1d5db"/>

    <rect x="79"
          y="148"
          width="15"
          height="15"
          rx="4"
          fill="#667eea"/>

    <rect x="104"
          y="149"
          width="78"
          height="10"
          rx="5"
          fill="#d1d5db"/>

    <!-- Completed task -->
    <circle cx="86.5"
            cy="184"
            r="8"
            fill="#22c55e"/>

    <path d="M82 184 L85 187 L91 180"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <rect x="104"
          y="179"
          width="55"
          height="10"
          rx="5"
          fill="#d1d5db"/>
</svg>